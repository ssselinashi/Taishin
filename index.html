<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#271513" />
    <title>柿餅蜂巢紙貓床｜3D 展示</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main>
      <header>
        <p class="eyebrow">THE YOUNG SQUARE · INTERACTIVE PROTOTYPE</p>
        <h1>柿餅蜂巢紙貓床</h1>
        <p class="subtitle">以手指拖曳，360° 探索蜂巢紙的收放結構。</p>
      </header>
      <section class="viewer" aria-label="可互動的柿餅蜂巢紙貓床三維模型">
        <canvas id="scene"></canvas>
        <p class="gesture">← 拖曳旋轉 · 雙指縮放 →</p>
        <button id="reset" type="button">重設視角</button>
      </section>
      <section class="controls" aria-label="產品展開控制">
        <div class="control-heading"><span>展開程度</span><output id="amount">100%</output></div>
        <input id="expand" type="range" min="0" max="100" value="100" aria-label="調整貓床展開程度" />
        <div class="labels"><span>收合</span><span>展開</span></div>
      </section>
      <section class="facts">
        <div><strong id="dimension">Ø 50 × H 17 cm</strong><span>目前尺寸（示意）</span></div>
        <div><strong>100% 再生紙</strong><span>蜂巢紙結構</span></div>
      </section>
      <p class="notice">此為互動概念原型；外觀與比例依商品公開資訊製作，非正式產品規格圖。</p>
    </main>
    <script type="importmap">
      { "imports": { "three": "https://unpkg.com/three@0.180.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.180.0/examples/jsm/" } }
    </script>
    <script type="module" src="./app.js"></script>
  </body>
</html>
