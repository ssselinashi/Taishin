<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>蜂巢紙立體模型</title>
<style>
  :root{--bg:#efebe4;--fg:#2f2b25;--muted:#8b8375;--line:#d3ccbe;--kraft:#8a6a44}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  @supports(height:100dvh){html,body{height:100dvh}}
  body{background:var(--bg);color:var(--fg);
    font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
    font-weight:400;-webkit-font-smoothing:antialiased;
    position:fixed;top:0;left:0;right:0;bottom:0;overflow:hidden;
    overscroll-behavior:none;touch-action:manipulation;
    -webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
  #stage{position:absolute;inset:0}
  canvas{display:block;touch-action:none}

  header{position:absolute;top:0;left:0;padding:26px 28px;pointer-events:none;max-width:66%}
  header h1{font-size:26px;font-weight:500;letter-spacing:.06em}
  header .en{font-size:15px;letter-spacing:.1em;color:#6d6455;margin-top:7px}
  header .note{font-size:15px;color:var(--fg);margin-top:18px;line-height:1.85;
    padding-left:12px;border-left:2px solid var(--kraft)}

  #angle{position:absolute;top:28px;right:28px;text-align:right;pointer-events:none;
    font-size:12px;color:var(--muted);letter-spacing:.04em;font-variant-numeric:tabular-nums}
  #angle b{display:block;font-size:26px;font-weight:400;color:var(--fg);letter-spacing:-.01em;line-height:1.1}

  #panel{position:absolute;left:0;right:0;bottom:0;padding:20px 28px 26px;
    padding-bottom:calc(26px + env(safe-area-inset-bottom));touch-action:manipulation;
    background:linear-gradient(to top,rgba(239,235,228,.97) 55%,rgba(239,235,228,0));
    display:flex;flex-direction:column;gap:16px}
  .row{display:flex;align-items:center;gap:16px;flex-wrap:wrap}

  .tabs{display:flex;gap:0;border:1px solid var(--line);border-radius:2px;overflow:hidden}
  .tabs button{background:none;border:0;padding:9px 16px;cursor:pointer;color:var(--muted);
    font-family:inherit;font-size:13px;letter-spacing:.06em;transition:background .15s,color .15s}
  .tabs button+button{border-left:1px solid var(--line)}
  .tabs button[aria-pressed="true"]{background:var(--kraft);color:#fbf7f0}
  .tabs button:focus-visible{outline:2px solid var(--kraft);outline-offset:-2px}

  .slider-wrap{display:flex;align-items:center;gap:14px;flex:1;min-width:230px}
  .slider-wrap label{font-size:12px;color:var(--muted);white-space:nowrap;letter-spacing:.1em}
  input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:1px;background:var(--line);outline:none}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;border-radius:50%;
    background:#fff;border:1px solid #b9b0a0;box-shadow:0 1px 3px rgba(60,50,35,.25);cursor:grab}
  input[type=range]::-moz-range-thumb{width:15px;height:15px;border-radius:50%;background:#fff;
    border:1px solid #b9b0a0;box-shadow:0 1px 3px rgba(60,50,35,.25);cursor:grab}
  .pct{font-size:12px;min-width:42px;text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}

  .swatches{display:flex;align-items:center;gap:9px}
  .swatches .cap{font-size:12px;color:var(--muted);letter-spacing:.1em;margin-right:2px}
  .sw{width:22px;height:22px;border-radius:50%;border:1px solid rgba(60,50,35,.22);
    padding:0;cursor:pointer;background-clip:padding-box;transition:transform .15s}
  .sw:hover{transform:scale(1.12)}
  .sw[aria-pressed="true"]{box-shadow:0 0 0 1px var(--bg),0 0 0 2px var(--kraft)}
  .sw:focus-visible{outline:2px solid var(--kraft);outline-offset:3px}

  .txt{background:none;border:0;padding:6px 2px;cursor:pointer;color:var(--muted);
    font-family:inherit;font-size:12px;letter-spacing:.08em;border-bottom:1px solid transparent;
    transition:color .15s,border-color .15s}
  .txt:hover{color:var(--fg);border-bottom-color:var(--line)}
  .txt:focus-visible{outline:2px solid var(--kraft);outline-offset:2px}
  .hint{font-size:11px;color:var(--muted);letter-spacing:.03em}
  .sep{width:1px;height:16px;background:var(--line)}

  @media (max-width:380px){header h1{font-size:18px}header .en{font-size:12px}}
  @media (pointer:coarse){
    .txt{padding:11px 4px;font-size:13px}
    .tabs button{padding:11px 16px}
    .sw{width:28px;height:28px}
    input[type=range]::-webkit-slider-thumb{width:22px;height:22px}
    input[type=range]::-moz-range-thumb{width:22px;height:22px}
    #panel{padding:16px 18px 22px;gap:14px;padding-bottom:calc(22px + env(safe-area-inset-bottom))}
    header{padding:18px 20px}
    header h1{font-size:21px}
    header .en{font-size:13px}
    header .note{font-size:13px;margin-top:14px}
    #angle{top:18px;right:20px}
    .hint{width:100%}
    .sep{display:none}
  }

  #quizFab{position:absolute;top:118px;right:28px;z-index:5;
    background:var(--kraft);color:#fbf7f0;border:0;border-radius:20px;
    padding:10px 18px;font-family:inherit;font-size:12px;letter-spacing:.06em;
    cursor:pointer;box-shadow:0 2px 8px rgba(60,50,35,.25);
    display:flex;align-items:center;gap:7px;transition:transform .15s,box-shadow .15s}
  #quizFab:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(60,50,35,.32)}
  #quizFab:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
  #quizFab svg{width:15px;height:15px;flex:none}

  #quizOverlay{position:fixed;inset:0;background:rgba(47,43,37,.55);
    display:none;align-items:center;justify-content:center;z-index:50;
    padding:24px}
  #quizOverlay.open{display:flex}
  #quizCard{background:var(--bg);border-radius:6px;max-width:440px;width:100%;
    max-height:88vh;overflow-y:auto;padding:30px 28px 26px;position:relative;
    box-shadow:0 14px 44px rgba(30,25,15,.38);border:1px solid var(--line)}
  #quizClose{position:absolute;top:12px;right:12px;background:none;border:0;
    font-size:22px;line-height:1;color:var(--muted);cursor:pointer;padding:8px}
  #quizClose:hover{color:var(--fg)}
  #quizCard h2{font-size:19px;font-weight:500;letter-spacing:.05em;margin-bottom:9px}
  #quizCard .sub{font-size:13px;color:var(--muted);line-height:1.75;margin-bottom:22px}
  .quizOpts{display:flex;flex-direction:column;gap:12px;margin-bottom:4px}
  .quizOpt{display:flex;align-items:center;gap:14px;padding:13px 15px;
    border:1px solid var(--line);border-radius:4px;background:#fbf7f0;
    cursor:pointer;text-align:left;font-family:inherit;width:100%;
    transition:border-color .15s,background .15s}
  .quizOpt:hover:not([disabled]){border-color:var(--kraft)}
  .quizOpt:focus-visible{outline:2px solid var(--kraft);outline-offset:2px}
  .quizOpt .ic{width:42px;height:42px;flex:none;color:var(--kraft);
    display:flex;align-items:center;justify-content:center}
  .quizOpt .ic svg{width:100%;height:100%}
  .quizOpt .tx b{display:block;font-size:14px;font-weight:500;letter-spacing:.03em}
  .quizOpt .tx span{display:block;font-size:12px;color:var(--muted);margin-top:3px}
  .quizOpt.correct{border-color:#5b7a4f;background:#eef3e8}
  .quizOpt.wrong{border-color:#b5544a;background:#f6ebe8}
  .quizOpt[disabled]{cursor:default}

  #quizResult{display:none;margin-top:20px;padding-top:18px;border-top:1px solid var(--line)}
  #quizResult.show{display:block}
  #quizResult .verdict{font-size:13.5px;margin-bottom:18px;line-height:1.8}
  #quizResult .verdict b{color:var(--kraft);font-weight:500}
  .bar-row{margin-bottom:13px}
  .bar-row .lbl{display:flex;justify-content:space-between;font-size:12px;
    color:var(--fg);margin-bottom:6px;letter-spacing:.02em}
  .bar-row .lbl span:last-child{color:var(--muted);font-variant-numeric:tabular-nums}
  .bar-track{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
  .bar-fill{height:100%;border-radius:4px;background:var(--muted);width:0;
    transition:width .9s cubic-bezier(.2,.8,.2,1)}
  .bar-fill.top{background:var(--kraft)}
  #quizAgain{margin-top:6px}

  @media (pointer:coarse){
    #quizFab{padding:11px 16px;font-size:12.5px;top:112px}
    .quizOpt{padding:15px}
  }
  @media (max-width:380px){
    #quizFab span.fabTxt{display:none}
    #quizFab{padding:11px;border-radius:50%}
  }

  .quizScrap{display:flex;flex-direction:column;align-items:center;gap:6px;
    margin-bottom:20px;padding:14px 10px 12px;background:#fbf7f0;
    border:1px solid var(--line);border-radius:4px}
  .quizScrap img{width:104px;height:auto;display:block;transform:scaleX(-1)}
  .quizScrap span{font-size:11px;color:var(--muted);letter-spacing:.06em}

  .quizNest{display:flex;gap:12px;margin:16px 0}
  .quizNestItem{flex:1;display:flex;flex-direction:column;align-items:center;gap:7px;
    padding:10px 8px 9px;background:#fbf7f0;border:1px solid var(--line);border-radius:4px}
  .quizNestItem img{width:100%;max-width:150px;height:118px;display:block;
    object-fit:contain;object-position:bottom center}
  .quizNestItem span{font-size:12px;color:var(--fg);letter-spacing:.02em;text-align:center}
  .quizNestItem span b{color:var(--kraft);font-size:15px;font-weight:600;margin-right:2px}
  .nestNote{font-size:12.5px;color:var(--muted);line-height:1.8;margin-bottom:4px}
</style>
</head>
<body>
<div id="stage"></div>

<header>
  <h1 id="pName"></h1>
  <div class="en" id="pEn"></div>
  <div class="note">點一側背板可手動展開</div>
</header>

<div id="angle"><b id="deg">0°</b><span id="degCap">展開角度</span></div>

<div id="panel">
  <div class="row">
    <div class="slider-wrap">
      <label for="t">展開</label>
      <input id="t" type="range" min="0" max="1000" value="0" aria-label="展開程度">
      <span class="pct" id="pct">0%</span>
    </div>
  </div>
  <div class="row">
    <div class="tabs" id="tabs" role="group" aria-label="商品"></div>
    <div class="swatches" id="sw" role="group" aria-label="顏色"><span class="cap">顏色</span></div>
    <span class="sep"></span>
    <button class="txt" id="play">自動開合</button>
    <button class="txt" id="reset">重設視角</button>
    <span class="hint">拖曳側板開合・空白處拖曳旋轉・雙指縮放</span>
  </div>
</div>

<button id="quizFab" type="button">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.3 9.2a2.7 2.7 0 0 1 5.2.9c0 1.8-2.5 2.1-2.5 4.1"/><circle cx="12" cy="17" r=".35" fill="currentColor" stroke="none"/></svg>
  <span class="fabTxt">餘料利用率小測驗</span>
</button>

(function(){

  function persiShape(){
    var s=new THREE.Shape();
    s.moveTo(4,0); s.lineTo(84,0);
    s.absarc(84,6,6,-Math.PI/2,0,false);
    s.lineTo(90,44);
    s.absarc(74,44,16,0,Math.PI*150/180,false);
    s.bezierCurveTo(54,42,26,22,11,22);
    s.lineTo(3,22);
    s.absarc(3,19,3,Math.PI/2,Math.PI,false);
    s.lineTo(0,4);
    s.absarc(4,4,4,Math.PI,Math.PI*1.5,false);
    s.closePath(); return s;
  }
  function persiTopFill(tab,step,n){
    var i,x;
    for(i=0;i<n;i++) tab[i]=-1;
    for(i=0;i<n;i++){ x=i*step;
      if(x<=3) tab[i]=19+Math.sqrt(Math.max(9-(x-3)*(x-3),0));
      else if(x<=11) tab[i]=22;
      else if(x>=60.14) tab[i]=44+Math.sqrt(Math.max(256-(x-74)*(x-74),0)); }
    var p0=[60.14,52],c1=[54,42],c2=[26,22],p3=[11,22];
    for(var u=0;u<=1.0001;u+=0.0008){ var v=1-u;
      var bx=v*v*v*p0[0]+3*v*v*u*c1[0]+3*v*u*u*c2[0]+u*u*u*p3[0];
      var by=v*v*v*p0[1]+3*v*v*u*c1[1]+3*v*u*u*c2[1]+u*u*u*p3[1];
      var k=Math.round(bx/step); if(k>=0&&k<n&&tab[k]<0) tab[k]=by; }
    var lg=22; for(i=0;i<n;i++){ if(tab[i]<0) tab[i]=lg; else lg=tab[i]; }
  }
  function persiBot(x){
    if(x<4) return 4-Math.sqrt(Math.max(16-(4-x)*(4-x),0));
    if(x>84) return 6-Math.sqrt(Math.max(36-(x-84)*(x-84),0));
    return 0;
  }

  function rectShape(){
    var W=P.PL,H=P.H,R=P.RR,s=new THREE.Shape();
    s.moveTo(R,0); s.lineTo(W-R,0);
    s.absarc(W-R,R,R,-Math.PI/2,0,false);
    s.lineTo(W,H-R);
    s.absarc(W-R,H-R,R,0,Math.PI/2,false);
    s.lineTo(R,H);
    s.absarc(R,H-R,R,Math.PI/2,Math.PI,false);

    s.closePath(); return s;
  }
  function rectDy(x){

  }

  function rectBot(x){ return rectDy(x); }

  var PALETTE=[['淺牛',0xd8c19a],['白',0xf0ece4],['黃',0xe0a81c],
               ['紅',0xc0261d],['黑',0x2b2a27],['深棕',0x5f3a1e]];

  var PRODUCTS=[
    { id:'persi', tab:'小柿餅', form:'fan',
      name:'小物收納床　小柿餅', en:'Flexible tiny catchall — Petit Persi',
      N:100, M:12, w:2, f:6, H:60, L:95, PL:90,
      shape:persiShape, topFill:persiTopFill, bot:persiBot, TH:2,
      cam:330, boardColor:0xc4a67a,
      colors:PALETTE },
    { id:'block', tab:'小方塊', form:'linear',
      name:'桌上型展示架　小方塊', en:'Table Display "Ascend" — Small',
      N:115, M:8, w:3, f:10, H:100, L:100, PL:100, RR:15, closedThk:50, maxLen:500,
      shape:rectShape, topFill:rectTopFill, bot:rectBot, TH:8,
      cam:640, boardColor:0xd9b694,

  ];

  var P=null, SX=1, STEP=0.25, NH=0, topTab=null, botTab=null;

    P.topFill(topTab,STEP,NH);

  function lut(tab,worldX){

  var slider=document.getElementById('t'), playBtn=document.getElementById('play');
  var stage=document.getElementById('stage');
  var scene=new THREE.Scene();
  scene.background=new THREE.Color(0xefebe4);
  var camera=new THREE.PerspectiveCamera(34,1,1,40000);
  var coarse=window.matchMedia('(pointer:coarse)').matches;
  var renderer=new THREE.WebGLRenderer({antialias:true});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio,coarse?1.75:2));

  scene.add(new THREE.HemisphereLight(0xffffff,0xdcd3c4,0.72));
  var key=new THREE.DirectionalLight(0xfff6ea,0.85);

  scene.add(key); scene.add(key.target);
  var fill=new THREE.DirectionalLight(0xffffff,0.25); scene.add(fill);

  var paperMat=new THREE.MeshStandardMaterial({color:0xd8c19a,roughness:0.96,metalness:0,side:THREE.DoubleSide});
  var boardMat=new THREE.MeshStandardMaterial({color:0xc4a67a,roughness:0.9,metalness:0});
  var boardMatB=boardMat.clone();

  var geo=new THREE.BufferGeometry();
  var paper=new THREE.Mesh(geo,paperMat);
  paper.castShadow=true; paper.receiveShadow=true; scene.add(paper);

  var floor=new THREE.Mesh(new THREE.PlaneGeometry(1,1),new THREE.ShadowMaterial({opacity:0.17}));
  floor.rotation.x=-Math.PI/2; floor.receiveShadow=true; scene.add(floor);

  var maxSpan=1, posAttr=null, A=[0,0], B=[0,0];
  var theta=0.78, phi=0.92, zoomMul=1, baseDist=330, camX=0;

  function updateCam(){
    var d=baseDist*zoomMul, ty=-P.H*0.07;
    camera.position.set(camX+d*Math.sin(phi)*Math.cos(theta), d*Math.cos(phi), d*Math.sin(phi)*Math.sin(theta));
    camera.lookAt(camX,ty,0);
  }
  function setZoom(m){ zoomMul=Math.max(0.35,Math.min(3,m)); updateCam(); }
  function bounds(){
    if(P.form==='fan')
      return {cx:0, r:Math.sqrt(P.L*P.L+(P.H/2)*(P.H/2))};
    var maxLen=P.N*linTop(), h=maxLen/2;
    return {cx:h, r:Math.sqrt(h*h+(P.L/2)*(P.L/2)+(P.H/2)*(P.H/2))};

    baseDist=b.r/Math.sin(Math.min(vf,hf)/2)*(P.form==='fan'?1.06:1.42);

  function applyProduct(idx){
    P=PRODUCTS[idx]; SX=P.L/P.PL;

    var shp=P.shape();

    boardA.geometry=g1; boardB.geometry=g2;

    boardMat.color.setHex(P.boardColor); boardMatB.color.setHex(P.boardColor);
    paperMat.color.setHex(P.colors[0][1]);

    zoomMul=1; posAttr=null; t=0; slider.value=0;
    build(); fitCamera();
  }

  function profile(){

        a[k++]=ax;a[k++]=b1;a[k++]=az; a[k++]=bx;a[k++]=b2;a[k++]=bz; a[k++]=bx;a[k++]=t2;a[k++]=bz;

    ndc.x=((e.clientX-r.left)/r.width)*2-1;
    ndc.y=-((e.clientY-r.top)/r.height)*2+1;
    ray.setFromCamera(ndc,camera);
  }
  function overBoard(e){ setRay(e); return ray.intersectObject(boardB,false).length>0; }
  function grabVal(e){
    setRay(e);
    if(!ray.ray.intersectPlane(hPlane,hitPt)) return null;
    return (P.form==='fan') ? Math.atan2(hitPt.z,hitPt.x) : hitPt.x;
  }
  function applyGrab(cur){
    if(P.form==='fan'){
      var da=cur-prevA;
      while(da>Math.PI) da-=TWO;
      while(da<-Math.PI) da+=TWO;
      prevA=cur;
      var ang=(MINF+t*(1-MINF))*TWO+da;
      ang=Math.max(MINF*TWO,Math.min(TWO,ang));
      setT((ang/TWO-MINF)/(1-MINF));
    } else {
      var dx=cur-prevA; prevA=cur;
      var s=linS()+dx/P.N, a=linMin();
      setT((s-a)/(linTop()-a));
    }
  }
  function setHover(on){
    if(on===hovering) return;
    hovering=on;
    boardMatB.emissive.setHex(on?0x241a0e:0x000000);
    el.style.cursor=on?'grab':'default';
  }
  function twoDist(){
    var it=ptrs.values(),a=it.next().value,b=it.next().value;
    var dx=a.x-b.x,dy=a.y-b.y; return Math.sqrt(dx*dx+dy*dy);
  }

  el.addEventListener('pointerdown',function(e){
    el.setPointerCapture(e.pointerId);
    ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(ptrs.size===1){
      if(overBoard(e)){
        var v=grabVal(e);
        if(v!==null){
          boardDrag=true; prevA=v; dragging=false;
          playing=false; playBtn.textContent='自動開合';
          el.style.cursor='grabbing'; return;
        }
      }
      dragging=true; px=e.clientX; py=e.clientY;
    } else if(ptrs.size===2){ dragging=false; boardDrag=false; pinchRef=twoDist(); zoomRef=zoomMul; }
  });
  el.addEventListener('pointermove',function(e){
    if(!ptrs.has(e.pointerId)) return;
    ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(ptrs.size>=2){
      if(pinchRef>0){ var d=twoDist(); if(d>0) setZoom(zoomRef*pinchRef/d); }
      return;
    }
    if(boardDrag){ var v=grabVal(e); if(v!==null) applyGrab(v); return; }
    if(!dragging) return;
    theta+=(e.clientX-px)*0.008;
    phi=Math.max(0.2,Math.min(1.5,phi-(e.clientY-py)*0.006));
    px=e.clientX; py=e.clientY; updateCam();
  });
  el.addEventListener('pointermove',function(e){
    if(dragging||boardDrag||ptrs.size>0) return;
    setHover(overBoard(e));
  });
  function release(e){
    ptrs.delete(e.pointerId);
    if(ptrs.size<2) pinchRef=0;
    if(boardDrag&&ptrs.size===0){ boardDrag=false; el.style.cursor=hovering?'grab':'default'; }
    if(ptrs.size===1){ var r=ptrs.values().next().value; px=r.x; py=r.y; dragging=true; }
    if(ptrs.size===0) dragging=false;
  }
  el.addEventListener('pointerup',release);
  el.addEventListener('pointercancel',release);
  el.addEventListener('wheel',function(e){ e.preventDefault(); setZoom(zoomMul*(1+e.deltaY*0.0012)); },{passive:false});
  el.addEventListener('webglcontextlost',function(e){ e.preventDefault(); });

  var swBox=document.getElementById('sw');
  function buildSwatches(){
    swBox.querySelectorAll('.sw').forEach(function(o){ o.remove(); });
    P.colors.forEach(function(col,i){
      var b=document.createElement('button');
      b.className='sw'; b.type='button';
      b.style.background='#'+col[1].toString(16).padStart(6,'0');
      b.setAttribute('aria-label',col[0]);
      b.setAttribute('aria-pressed', i===0?'true':'false');
      b.onclick=function(){
        paperMat.color.setHex(col[1]);
        swBox.querySelectorAll('.sw').forEach(function(o){ o.setAttribute('aria-pressed','false'); });
        b.setAttribute('aria-pressed','true');
      };
      swBox.appendChild(b);
    });
  }

  var tabBox=document.getElementById('tabs'), curIdx=0;
  PRODUCTS.forEach(function(pr,i){
    var b=document.createElement('button');
    b.type='button'; b.textContent=pr.tab;
    b.setAttribute('aria-pressed', i===0?'true':'false');
    b.onclick=function(){
      if(curIdx===i) return;
      curIdx=i;
      tabBox.querySelectorAll('button').forEach(function(o){ o.setAttribute('aria-pressed','false'); });
      b.setAttribute('aria-pressed','true');
      applyProduct(i);
    };
    tabBox.appendChild(b);
  });

  slider.addEventListener('input',function(){
    playing=false; playBtn.textContent='自動開合';
    setT(slider.value/1000);
  });
  playBtn.onclick=function(){ playing=!playing; playBtn.textContent=playing?'暫停':'自動開合'; };
  document.getElementById('reset').onclick=function(){ theta=0.78; phi=0.92; setZoom(1); };

  function resize(){
    var w=stage.clientWidth,h=stage.clientHeight;
    renderer.setSize(w,h); camera.aspect=w/h; camera.updateProjectionMatrix();
    fitCamera();
  }
  window.addEventListener('resize',resize);
  window.addEventListener('orientationchange',function(){ setTimeout(resize,220); });

  var last=performance.now();
  function loop(now){
    var dt=Math.min((now-last)/1000,0.05); last=now;
    if(playing){
      var v=t+dir*dt*0.3;
      if(v>=1){v=1;dir=-1;} if(v<=0){v=0;dir=1;}
      setT(v);
    }
    renderer.render(scene,camera);
    requestAnimationFrame(loop);
  }
  resize(); applyProduct(0);
  if(!window.matchMedia('(prefers-reduced-motion: reduce)').matches){
    playing=true; playBtn.textContent='暫停';
  }
  requestAnimationFrame(loop);
})();
</script>

<script>
(function(){
  var DATA=[
    {id:'persi', name:'小物收納床「小柿餅」', util:60},
    {id:'block', name:'桌上展示架「小方塊」', util:40}
  ];
  var CORRECT = DATA.reduce(function(a,b){ return b.util>a.util ? b : a; }).id;

  var fab=document.getElementById('quizFab');
  var overlay=document.getElementById('quizOverlay');
  var closeBtn=document.getElementById('quizClose');
  var opts=document.getElementById('quizOpts');
  var result=document.getElementById('quizResult');
  var verdict=document.getElementById('quizVerdict');
  var bars=document.getElementById('quizBars');
  var again=document.getElementById('quizAgain');
  var answered=false;

  function buildBars(){
    bars.innerHTML='';
    DATA.slice().sort(function(a,b){ return b.util-a.util; }).forEach(function(d){
      var row=document.createElement('div'); row.className='bar-row';
      var lbl=document.createElement('div'); lbl.className='lbl';
      lbl.innerHTML='<span>'+d.name+'</span><span>'+d.util+'%</span>';
      var track=document.createElement('div'); track.className='bar-track';
      var fill=document.createElement('div'); fill.className='bar-fill'+(d.id===CORRECT?' top':'');
      track.appendChild(fill);
      row.appendChild(lbl); row.appendChild(track);
      bars.appendChild(row);
      requestAnimationFrame(function(){ requestAnimationFrame(function(){ fill.style.width=d.util+'%'; }); });
    });
  }

  function reveal(pickedId){
    answered=true;
    Array.prototype.forEach.call(opts.children,function(btn){
      btn.disabled=true;
      if(btn.dataset.id===CORRECT) btn.classList.add('correct');
      else if(btn.dataset.id===pickedId) btn.classList.add('wrong');
    });
    var ok=pickedId===CORRECT;
    var correctD=DATA.filter(function(d){ return d.id===CORRECT; })[0];
    verdict.innerHTML = ok
      ? '答對了！<b>'+correctD.name+'</b> 的餘料利用率確實最高，達 <b>'+correctD.util+'%</b>。'
      : '差一點～利用率最高的其實是 <b>'+correctD.name+'</b>，達 <b>'+correctD.util+'%</b>。';
    buildBars();
    result.classList.add('show');
  }

  function resetQuiz(){
    answered=false;
    Array.prototype.forEach.call(opts.children,function(btn){
      btn.disabled=false;
      btn.classList.remove('correct','wrong');
    });
    result.classList.remove('show');
  }

  opts.addEventListener('click',function(e){
    var btn=e.target.closest('.quizOpt');
    if(!btn||answered) return;
    reveal(btn.dataset.id);
  });

  function openQuiz(){ overlay.classList.add('open'); resetQuiz(); }
  function closeQuiz(){ overlay.classList.remove('open'); }

  fab.addEventListener('click',openQuiz);
  closeBtn.addEventListener('click',closeQuiz);
  overlay.addEventListener('click',function(e){ if(e.target===overlay) closeQuiz(); });
  document.addEventListener('keydown',function(e){ if(e.key==='Escape'&&overlay.classList.contains('open')) closeQuiz(); });
  again.addEventListener('click',resetQuiz);
})();
</script>
</body>
